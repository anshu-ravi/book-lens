[project]
name = "booklens"
version = "0.1.0"
description = "A spoiler-free reading companion"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "claude-agent-sdk"]
llm = ["claude-agent-sdk"]

[project.scripts]
booklens = "booklens.cli:main"

[tool.setuptools.packages.find]
include = ["booklens*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not realmodel\""
markers = [
    "realmodel: makes real calls to a live LLM provider; opt-in via `pytest -m realmodel`, spends quota, needs auth.",
]

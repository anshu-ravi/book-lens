[project]
name = "booklens"
version = "0.1.0"
description = "A spoiler-free reading companion"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "claude-agent-sdk"]
llm = ["claude-agent-sdk"]

[project.scripts]
booklens = "booklens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not realmodel\""
markers = [
    "realmodel: makes real calls to a live LLM provider; opt-in via `pytest -m realmodel`, spends quota, needs auth.",
]

[project]
name = "booklens"
version = "0.1.0"
description = "A spoiler-free reading companion"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
booklens = "booklens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
